<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="UTF-8" />

		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="css/themes.css" />
		<link rel="stylesheet" href="css/style.css" />
		<title>Catalog — a_tattoowork</title>
	</head>
	<body>
		<header class="header">
			<div class="container header__inner">
				<a href="index.html" class="logo">a_tattoowork</a>

				<nav class="nav" id="nav">
					<ul class="nav__list">
						<li><a href="index.html#about" class="nav__link">About</a></li>
						<li>
							<a href="index.html#services" class="nav__link">Services</a>
						</li>
						<li>
							<a href="index.html#portfolio" class="nav__link">Portfolio</a>
						</li>
						<li><a href="index.html#masters" class="nav__link">Masters</a></li>
						<li>
							<a href="catalog.html" class="nav__link nav__link--active"
								>Catalog</a
							>
						</li>
						<li><a href="index.html#contact" class="nav__link">Contact</a></li>
					</ul>
				</nav>

				<div class="header__actions">
					<button
						class="theme-toggle"
						id="themeToggle"
						type="button"
						aria-label="Toggle theme"
					>
						<span class="theme-toggle__icon">☀</span>
					</button>
					<button
						class="burger"
						id="burger"
						type="button"
						aria-label="Open menu"
					>
						<span></span><span></span><span></span>
					</button>
				</div>
			</div>
		</header>
		<main>
			<section class="section">
				<div class="container">
					<h1 class="section__title">Catalog</h1>

					<ul class="categories" id="categories">
						<li>
							<button
								class="category category--active"
								data-category="all"
								type="button"
							>
								All
							</button>
						</li>
						<li>
							<button class="category" data-category="graphics" type="button">
								Graphics
							</button>
						</li>
						<li>
							<button class="category" data-category="whip" type="button">
								whip
							</button>
						</li>
						<li>
							<button class="category" data-category="minimalism" type="button">
								Minimalism
							</button>
						</li>
						<li>
							<button class="category" data-category="lettering" type="button">
								Lettering
							</button>
						</li>
					</ul>

					<!-- Карточки -->
					<ul class="cards" id="cards"></ul>

					<!-- Кнопка "Показать ещё" -->
					<button
						class="btn btn--primary cards__more"
						type="button"
						id="showMore"
					>
						Показать ещё
					</button>
				</div>
			</section>
		</main>
		<footer class="footer">
			<div class="container footer__inner">
				<div class="footer__col">
					<p class="footer__brand">a_tattoowork</p>
					<p class="footer__year">© 2026</p>
				</div>

				<div class="footer__col">
					<p class="footer__heading">Contact</p>
					<ul class="footer__list">
						<li><a href="tel:+375291234567">+375 (29) 123-45-67</a></li>
						<li>
							<a href="mailto:andrey.gevrasyow@gmail.com"
								>andrey.gevrasyow@gmail.com</a
							>
						</li>
					</ul>
				</div>

				<div class="footer__col">
					<p class="footer__heading">Social</p>
					<ul class="footer__list">
						<li>
							<a href="https://t.me/Forest3377" target="_blank" rel="noopener"
								>Telegram</a
							>

						<li>
							<a

								target="_blank"

				<a
					class="footer__logo"
					href="https://rs.school/js/"
					target="_blank"
					rel="noopener"
				>
					<img
						src="assets/icons/rs-school-logo.svg"
						alt="RS School"
						width="90"
						height="30"
					/>
				</a>
			</div>
		</footer>
		<script src="js/theme.js"></script>
		<script type="module" src="js/data.js"></script>
		<script type="module" src="js/catalog.js"></script>
